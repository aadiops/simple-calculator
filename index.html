<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
    }

    .calculator {
      width: 320px;
      background: #1f1f1f;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.25);
    }

    .display {
      width: 100%;
      height: 70px;
      background: #2b2b2b;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 2rem;
      text-align: right;
      padding: 0 16px;
      margin-bottom: 20px;
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 60px;
      border: none;
      border-radius: 12px;
      font-size: 1.3rem;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.2s ease, box-shadow 0.1s ease;
    }

    button:hover {
      opacity: 0.95;
    }

    button:active,
    button.pressed {
      transform: scale(0.98);
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.5);
    }

    .operator {
      background: #ff9f1c;
      color: white;
    }

    .number {
      background: #e9e9e9;
      color: #1f1f1f;
    }

    .function {
      background: #b0b0b0;
      color: #111;
    }

    .zero {
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <input class="display" id="display" type="text" readonly value="0" />

    <div class="buttons">
      <button class="function" data-action="clear">C</button>
      <button class="function" data-action="delete">⌫</button>
      <button class="operator" data-action="operator" data-value="%">%</button>
      <button class="operator" data-action="operator" data-value="/">÷</button>

      <button class="number" data-value="7">7</button>
      <button class="number" data-value="8">8</button>
      <button class="number" data-value="9">9</button>
      <button class="operator" data-action="operator" data-value="*">×</button>

      <button class="number" data-value="4">4</button>
      <button class="number" data-value="5">5</button>
      <button class="number" data-value="6">6</button>
      <button class="operator" data-action="operator" data-value="-">−</button>

      <button class="number" data-value="1">1</button>
      <button class="number" data-value="2">2</button>
      <button class="number" data-value="3">3</button>
      <button class="operator" data-action="operator" data-value="+">+</button>

      <button class="number zero" data-value="0">0</button>
      <button class="number" data-value=".">.</button>
      <button class="operator" data-action="equals">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');
    let currentValue = '0';
    let firstOperand = null;
    let operator = null;
    let waitingForSecondOperand = false;

    function updateDisplay() {
      display.value = currentValue;
    }

    function inputDigit(digit) {
      if (waitingForSecondOperand) {
        currentValue = digit;
        waitingForSecondOperand = false;
      } else {
        currentValue = currentValue === '0' ? digit : currentValue + digit;
      }
      updateDisplay();
    }

    function inputDecimal() {
      if (waitingForSecondOperand) {
        currentValue = '0.';
        waitingForSecondOperand = false;
      } else if (!currentValue.includes('.')) {
        currentValue += '.';
      }
      updateDisplay();
    }

    function performCalculation() {
      const secondOperand = parseFloat(currentValue);
      if (firstOperand === null || operator === null) return secondOperand;

      switch (operator) {
        case '+':
          return firstOperand + secondOperand;
        case '-':
          return firstOperand - secondOperand;
        case '*':
          return firstOperand * secondOperand;
        case '/':
          return firstOperand / secondOperand;
        case '%':
          return firstOperand % secondOperand;
        default:
          return secondOperand;
      }
    }

    function handleOperator(nextOperator) {
      const inputValue = parseFloat(currentValue);

      if (firstOperand === null) {
        firstOperand = inputValue;
      } else if (operator) {
        const result = performCalculation();
        currentValue = String(result);
        firstOperand = result;
      }

      waitingForSecondOperand = true;
      operator = nextOperator;
      updateDisplay();
    }

    function clearCalculator() {
      currentValue = '0';
      firstOperand = null;
      operator = null;
      waitingForSecondOperand = false;
      updateDisplay();
    }

    function deleteLastDigit() {
      if (waitingForSecondOperand) return;

      currentValue = currentValue.length > 1
        ? currentValue.slice(0, -1)
        : '0';

      updateDisplay();
    }

    function evaluate() {
      if (operator === null || waitingForSecondOperand) return;

      const result = performCalculation();
      currentValue = String(result);
      firstOperand = null;
      operator = null;
      waitingForSecondOperand = false;
      updateDisplay();
    }

    function getButtonForKey(key) {
      const selector = key === 'Enter' || key === '='
        ? '[data-action="equals"]'
        : key === 'Backspace' || key === 'Delete'
          ? '[data-action="delete"]'
          : key === 'Escape' || key === 'c' || key === 'C'
            ? '[data-action="clear"]'
            : `button[data-value="${key}"]`;

      return document.querySelector(selector);
    }

    function pressButton(button) {
      if (!button) return;
      button.classList.add('pressed');
      setTimeout(() => button.classList.remove('pressed'), 120);
    }

    function handleKeyInput(event) {
      const key = event.key;
      const isNumber = /^[0-9]$/.test(key);
      const isOperator = ['+', '-', '*', '/', '%'].includes(key);
      const isDecimal = key === '.';
      const isEquals = key === '=' || key === 'Enter';
      const isClear = key === 'Escape' || key.toLowerCase() === 'c';
      const isDelete = key === 'Backspace' || key === 'Delete';

      if (isNumber) {
        event.preventDefault();
        inputDigit(key);
        pressButton(getButtonForKey(key));
        return;
      }

      if (isOperator) {
        event.preventDefault();
        handleOperator(key);
        pressButton(getButtonForKey(key));
        return;
      }

      if (isDecimal) {
        event.preventDefault();
        inputDecimal();
        pressButton(getButtonForKey('.'));
        return;
      }

      if (isEquals) {
        event.preventDefault();
        evaluate();
        pressButton(getButtonForKey('Enter'));
        return;
      }

      if (isClear) {
        event.preventDefault();
        clearCalculator();
        pressButton(getButtonForKey('Escape'));
        return;
      }

      if (isDelete) {
        event.preventDefault();
        deleteLastDigit();
        pressButton(getButtonForKey('Backspace'));
      }
    }

    document.querySelectorAll('.number').forEach(button => {
      button.addEventListener('click', () => {
        const value = button.dataset.value;
        if (value === '.') {
          inputDecimal();
        } else {
          inputDigit(value);
        }
      });
    });

    document.querySelectorAll('.operator').forEach(button => {
      button.addEventListener('click', () => {
        const action = button.dataset.action;

        if (action === 'operator') {
          handleOperator(button.dataset.value);
        } else if (action === 'equals') {
          evaluate();
        }
      });
    });

    document.querySelector('[data-action="clear"]').addEventListener('click', clearCalculator);
    document.querySelector('[data-action="delete"]').addEventListener('click', deleteLastDigit);
    document.addEventListener('keydown', handleKeyInput);

    updateDisplay();
  </script>
</body>
</html>
